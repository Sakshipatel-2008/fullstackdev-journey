<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <nav>
        <ul>
            <li class="brand"><img src="spo-logo.png" alt="Spotify logo"> Spotify</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>
    <div class="container">
        <div class="songList">
            <h1>Bollywood Hits</h1>
            <p class="subtitle">The best of Bollywood music</p>
            <div class="songItemContainer">
                <div class="songItem">
                    <img src="cover.jpg" alt="1">
                    <div class="songText">
                        <span class="songName">Valam</span>
                        <span class="artistname">Arijit Singh</span>
                    </div>
                    <span class="songlistplay"><span class="timestamp">03:48<i  id="0"
                            class="fa-songItemPlay fa-solid fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1">
                    <div class="songText">
                    <span class="songName">Bargad</span>
                    <span class="artistname">Sufr</span></div>
                    <span class="songlistplay"><span class="timestamp">03:48<i id="1"
                            class="fa-songItemPlay fa-solid fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1">
                    <div class="songText">
                    <span class="songName">Bairan</span>
                    <span class="artistname">Banjaare</span></div>
                    <span class="songlistplay"><span class="timestamp">03:48<i id="2"
                            class="fa-songItemPlay fa-solid fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1">
                    <div class="songText">
                    <span class="songName">I can't fit in</span>
                    <span class="artistname">Marino</span></div>
                    <span class="songlistplay"><span class="timestamp">03:48<i id="3"
                            class="fa-songItemPlay fa-solid fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1">
                    <div class="songText">
                    <span class="songName">Ud gaye</span>
                    <span class="artistname">Ritviz</span></div>
                    <span class="songlistplay"><span class="timestamp">03:48<i id="4"
                            class="fa-songItemPlay fa-solid fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1">
                    <div class="songText">
                    <span class="songName">Barsaat</span>
                    <span class="artistname">Banjare</span></div>
                    <span class="songlistplay"><span class="timestamp">03:48<i id="5"
                            class="fa-songItemPlay fa-solid fa-circle-play"></i></span></span>
                </div>

            </div>



        </div>
        <div class="songBanner"></div>
    </div>
    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <!-- fontawesome icons -->

            <i class="fa-solid fa-backward-step"></i>
            <i class="fa-solid fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-forward-step"></i>
        </div>
       <div class="songInfo">
        <img src="song1.jpg" id="gif" width="42px">
        <span id="masterSongName"></span>
        </div>
    </div>
    <script src="script.js"></script>


</body>

</html>
